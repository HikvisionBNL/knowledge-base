<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hikvision Knowledge Base</title>
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body>
    <button class="rail-toggle menu-icon" id="railToggle" type="button" aria-label="Show sidebar"><span></span><span></span><span></span></button>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <button class="sidebar-toggle menu-icon" id="sidebarToggle" type="button" aria-label="Hide sidebar"><span></span><span></span><span></span></button>
          <div>
            <h1>Hikvision Knowledge Base</h1>
            <p>Case answers and downloadable guides</p>
          </div>
        </div>
        <label class="search-box">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Search by title, product, or keyword" autocomplete="off" />
        </label>
        <div class="search-status" id="searchStatus"></div>
        <nav class="tree" id="tree" aria-label="Knowledge base navigation"></nav>
      </aside>
      <main class="content">
        <div class="mobile-bar">
          <button class="sidebar-toggle menu-icon" id="mobileSidebarToggle" type="button" aria-label="Show sidebar"><span></span><span></span><span></span></button>
          <strong>Hikvision Knowledge Base</strong>
        </div>
        <section class="article" id="article"></section>
      </main>
    </div>
    <button
      class="question-button"
      id="questionButton"
      type="button"
      aria-label="提问"
    >提问</button>
    <div class="question-modal" id="questionModal" aria-hidden="true">
      <div class="question-backdrop" id="questionBackdrop"></div>
      <section class="question-panel" role="dialog" aria-modal="true" aria-label="提问">
        <div class="question-panel-header">
          <strong>提问</strong>
          <button class="question-close" id="questionClose" type="button" aria-label="Close">×</button>
        </div>
        <iframe
          id="questionFrame"
          title="Question form"
          data-src="https://tally.so/r/gDPJ7d?transparentBackground=1"
          loading="lazy"
        ></iframe>
      </section>
    </div>
    <script src="assets/app.js"></script>
  </body>
</html>
